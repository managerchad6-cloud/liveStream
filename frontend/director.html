<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Director Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1014;
      --panel: #1b1f2a;
      --text: #f0f2f8;
      --muted: #9aa4bf;
      --accent: #ffb347;
      --on-air: #f5d565;
      --danger: #ff6b6b;
      --good: #6ee7b7;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      padding-bottom: 60px;
    }

    #main {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 { margin: 0; font-size: 1.5rem; }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
    }

    .btn-primary { background: var(--accent); color: #000; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-small { padding: 4px 10px; font-size: 0.85rem; }

    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .panel {
      background: var(--panel);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .panel h2 {
      margin: 0 0 12px 0;
      font-size: 0.9rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Rendering section */
    #rendering-section {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      min-height: 50px;
      align-items: flex-start;
    }

    .rendering-card {
      background: #232838;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      min-width: 150px;
    }

    .rendering-card .type { font-weight: 600; }
    .rendering-card .seed { color: var(--muted); font-size: 0.8rem; margin: 4px 0; }
    .rendering-card.failed { border: 1px solid #c44; opacity: 0.7; }

    .progress-bar {
      height: 4px;
      background: #333;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.3s;
    }

    /* Pipeline section - horizontal row, rightmost = on-air */
    #pipeline-section {
      display: flex;
      flex-direction: row;
      gap: 12px;
      overflow-x: auto;
      padding: 8px 0;
      min-height: 100px;
      align-items: stretch;
    }

    .pipeline-card {
      background: #232838;
      padding: 12px 16px;
      border-radius: 10px;
      min-width: 160px;
      max-width: 200px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.3s;
      border: 2px solid transparent;
    }

    .pipeline-card.on-air {
      background: linear-gradient(135deg, rgba(245,213,101,0.3), rgba(35,40,56,0.95));
      border: 2px solid var(--on-air);
      box-shadow: 0 0 25px rgba(245,213,101,0.4);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 25px rgba(245,213,101,0.4); }
      50% { box-shadow: 0 0 35px rgba(245,213,101,0.6); }
    }

    .pipeline-card .type { font-weight: 600; font-size: 0.9rem; }
    .pipeline-card .seed { color: var(--muted); font-size: 0.8rem; }
    .pipeline-card .duration { color: var(--muted); font-size: 0.75rem; }

    .on-air-badge {
      background: var(--on-air);
      color: #000;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 0.7rem;
      align-self: flex-start;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Chat inbox */
    #chat-inbox {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      min-height: 50px;
      overflow-y: auto;
    }

    .chat-card {
      background: #232838;
      padding: 12px;
      border-radius: 8px;
      max-width: 280px;
    }

    .create-row-item .chat-card {
      max-width: 100%;
    }

    .chat-card .username { font-weight: 600; margin-bottom: 4px; font-size: 0.9rem; }
    .chat-card .text { font-size: 0.85rem; margin-bottom: 6px; }
    .chat-card .response-preview {
      font-size: 0.8rem;
      color: var(--muted);
      border-left: 2px solid var(--accent);
      padding-left: 8px;
      margin-bottom: 8px;
    }
    .chat-card .actions { display: flex; gap: 8px; }

    /* Archive */
    #archive-section {
      max-height: 150px;
      overflow-y: auto;
    }

    .archive-item {
      padding: 6px 0;
      border-bottom: 1px solid #2a3040;
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* 3-piece create row: Chat Inbox | Seed Prompt | Custom Script - independent boxes */
    .create-row {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
    }

    .create-row .panel {
      margin-bottom: 0;
    }

    .create-row-item {
      flex: 1;
      min-width: 0;
      min-height: 300px;
      display: flex;
      flex-direction: column;
    }

    .create-row-item h2 {
      flex-shrink: 0;
    }

    .create-row-item > div {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Director input (seed prompt) */
    #director-input {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #director-input textarea {
      flex: 1;
      min-height: 60px;
      background: #232838;
      border: 1px solid #3a4050;
      border-radius: 8px;
      color: var(--text);
      padding: 10px;
      font-family: inherit;
      resize: none;
    }

    #director-input .btn-primary {
      flex-shrink: 0;
    }

    .custom-script-input {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .custom-script-input input {
      flex-shrink: 0;
      background: #232838;
      color: var(--text);
      border: 1px solid #3a4050;
      border-radius: 8px;
      padding: 8px;
    }

    .custom-script-input textarea {
      flex: 1;
      min-height: 80px;
      background: #232838;
      border: 1px solid #3a4050;
      border-radius: 8px;
      color: var(--text);
      padding: 10px;
      font-family: monospace;
      font-size: 0.8rem;
      resize: none;
    }

    .custom-script-input .btn-primary {
      flex-shrink: 0;
    }

    .empty-state {
      color: var(--muted);
      font-style: italic;
      padding: 16px;
    }

    /* Media attach row */
    .attach-row {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1a1f2e;
      border: 1px dashed #3a4050;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 0.82rem;
      flex-shrink: 0;
    }
    .attach-row.has-media {
      border-color: var(--accent);
      border-style: solid;
    }
    .attach-name {
      flex: 1;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.8rem;
    }
    .attach-name.set { color: var(--text); }
    .btn-attach {
      background: #2a3040;
      color: var(--muted);
      padding: 3px 8px;
      font-size: 0.75rem;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-attach:hover { background: #3a4050; color: var(--text); }

    /* Pipeline card attach button */
    .pipeline-card .btn-attach {
      margin-top: auto;
      width: 100%;
      text-align: center;
    }
    .pipeline-card .attach-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: 4px;
      background: #0a0a1a;
      margin-top: 4px;
    }
    .rendering-card .btn-attach {
      margin-top: 6px;
      width: 100%;
    }

    /* Picker modal */
    #picker-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    #picker-modal.open { display: flex; }
    .picker-inner {
      background: var(--panel);
      border-radius: 12px;
      padding: 20px;
      width: 92%;
      max-width: 700px;
      max-height: 78vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .picker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .picker-header h3 { margin: 0; font-size: 1rem; color: var(--accent); }
    .picker-search {
      width: 100%;
      background: #232838;
      border: 1px solid #3a4050;
      border-radius: 6px;
      color: var(--text);
      padding: 8px 10px;
      font-family: inherit;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .picker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
      overflow-y: auto;
      flex: 1;
    }
    .picker-item {
      background: #232838;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.15s;
    }
    .picker-item:hover { border-color: var(--accent); }
    .picker-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      background: #0a0a1a;
      display: block;
    }
    .picker-thumb-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      background: #0a0a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5em;
    }
    .picker-item-name {
      font-size: 0.72em;
      color: var(--muted);
      padding: 5px 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hype-field {
      background: #0f1014;
      border: 1px solid #ff4500;
      border-radius: 6px;
      color: var(--text);
      padding: 8px 10px;
      font-family: inherit;
      font-size: 0.85rem;
    }
    .hype-field::placeholder { color: #663300; }

    #status-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--panel);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--muted);
      border-top: 1px solid #2a3040;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--good);
    }

    .status-dot.playing { background: var(--on-air); animation: blink 1s infinite; }
    .status-dot.paused { background: var(--accent); }
    .status-dot.stopped { background: var(--muted); }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div id="main">
  <header>
    <h1>Director Console</h1>
    <div class="controls">
      <label>
        <input type="checkbox" id="filler-toggle">
        Filler
      </label>
      <button class="btn-primary" id="play-btn">Play</button>
      <button class="btn-danger" id="pause-btn">Pause</button>
    </div>
  </header>

  <!-- Hype panel -->
  <div class="panel hype-panel" style="margin-bottom:16px;background:linear-gradient(135deg,#1a0a00,#1b1f2a);border:1px solid #ff6600;">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      <button class="btn-primary" id="hype-btn" style="background:#ff4500;font-size:1.1rem;font-weight:700;letter-spacing:1px;padding:10px 24px;flex-shrink:0;">HYPE</button>
      <input id="hype-mcap" placeholder="MCap (e.g. 420K)" style="width:130px;" class="hype-field" />
      <input id="hype-volume" placeholder="Volume (e.g. 69K)" style="width:130px;" class="hype-field" />
      <input id="hype-holders" placeholder="Holders (e.g. 420)" style="width:130px;" class="hype-field" />
      <span id="hype-status" style="font-size:0.8rem;color:#ff6600;"></span>
    </div>
  </div>

  <div id="create-row" class="create-row">
    <div class="panel create-row-item">
      <h2 style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">
        Chat Inbox
        <label style="font-size:0.8rem;text-transform:none;letter-spacing:0;">
          <input type="checkbox" id="auto-approve-toggle">
          Auto-approve
        </label>
      </h2>
      <div id="chat-inbox">
        <span class="empty-state">No messages</span>
      </div>
    </div>
    <div class="panel create-row-item">
      <h2>Create Segment (Seed Prompt)</h2>
      <div id="director-input">
        <textarea id="seed-input" placeholder="Enter a topic or question..."></textarea>
        <div class="attach-row" id="seed-attach-row">
          <span>📺</span>
          <span class="attach-name" id="seed-attach-name">No TV media</span>
          <button class="btn-attach" onclick="openPicker('seed')">Library</button>
          <label style="cursor:pointer;margin:0;">
            <input type="file" id="seed-attach-file" accept="image/*,video/*" style="display:none;" onchange="onAttachFile('seed')">
            <span class="btn-attach">Upload</span>
          </label>
          <button class="btn-attach" id="seed-attach-clear" style="display:none;color:#f66;" onclick="clearAttach('seed')">✕</button>
        </div>
        <button class="btn-primary" id="create-btn">Create</button>
      </div>
    </div>
    <div class="panel create-row-item">
      <h2>Create Segment (Custom Script JSON)</h2>
      <div id="custom-script-input" class="custom-script-input">
        <input id="custom-seed-input" placeholder="Optional seed/title (e.g. custom opener)" />
        <textarea id="custom-script-json" placeholder='{"script":[{"speaker":"chad","text":"..."},{"speaker":"virgin","text":"..."}],"exitContext":"..."}'></textarea>
        <div class="attach-row" id="script-attach-row">
          <span>📺</span>
          <span class="attach-name" id="script-attach-name">No TV media</span>
          <button class="btn-attach" onclick="openPicker('script')">Library</button>
          <label style="cursor:pointer;margin:0;">
            <input type="file" id="script-attach-file" accept="image/*,video/*" style="display:none;" onchange="onAttachFile('script')">
            <span class="btn-attach">Upload</span>
          </label>
          <button class="btn-attach" id="script-attach-clear" style="display:none;color:#f66;" onclick="clearAttach('script')">✕</button>
        </div>
        <button class="btn-primary" id="create-custom-btn">Create Custom</button>
      </div>
    </div>
  </div>

  <!-- Media picker modal -->
  <div id="picker-modal">
    <div class="picker-inner">
      <div class="picker-header">
        <h3>Pick TV Media</h3>
        <button class="btn-attach" onclick="closePicker()">✕ Close</button>
      </div>
      <input class="picker-search" id="picker-search" placeholder="Search by filename..." oninput="renderPickerGrid()">
      <div class="picker-grid" id="picker-grid">
        <span class="empty-state">Loading...</span>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>Rendering</h2>
    <div id="rendering-section">
      <span class="empty-state">No segments rendering</span>
    </div>
  </div>

  <div class="panel">
    <h2>Pipeline <span style="font-weight:normal;font-size:0.8rem;">(rightmost = on air)</span></h2>
    <div id="pipeline-section">
      <span class="empty-state">Pipeline empty</span>
    </div>
  </div>

  <details class="panel">
    <summary style="cursor:pointer;color:var(--muted);">Archive</summary>
    <div id="archive-section"></div>
    <button class="btn-small btn-danger" id="clear-archive" style="margin-top:10px;">Clear</button>
  </details>
  </div>

  <div id="status-bar">
    <div class="status-indicator">
      <div class="status-dot" id="status-dot"></div>
      <span id="playback-status">Connecting...</span>
    </div>
    <span id="buffer-info">Buffer: 0s</span>
  </div>

  <script>
    const API_BASE = window.DIRECTOR_API_BASE || `${window.location.protocol}//${window.location.hostname}:3003`;
    let ws = null;
    let currentSegmentId = null;

    // ---- Media attach state ----
    // attachState[tab] = { id, name, type, file } or null
    const attachState = { seed: null, script: null };
    let libItems = [];
    let pickerTarget = null; // 'seed' | 'script' | 'seg:<segmentId>'

    function setAttach(tab, item) {
      attachState[tab] = item;
      const nameEl = document.getElementById(`${tab}-attach-name`);
      const clearBtn = document.getElementById(`${tab}-attach-clear`);
      const row = document.getElementById(`${tab}-attach-row`);
      if (item) {
        nameEl.textContent = item.name;
        nameEl.classList.add('set');
        clearBtn.style.display = 'inline-block';
        row.classList.add('has-media');
      } else {
        nameEl.textContent = 'No TV media';
        nameEl.classList.remove('set');
        clearBtn.style.display = 'none';
        row.classList.remove('has-media');
      }
    }

    function clearAttach(tab) {
      setAttach(tab, null);
      document.getElementById(`${tab}-attach-file`).value = '';
    }

    function onAttachFile(tab) {
      const file = document.getElementById(`${tab}-attach-file`).files[0];
      if (!file) return;
      setAttach(tab, { id: null, name: file.name, type: file.type.startsWith('video') ? 'video' : 'image', file });
    }

    async function uploadAttachFile(file) {
      const fd = new FormData();
      fd.append('file', file);
      const res = await fetch(`${API_BASE}/api/media/upload`, { method: 'POST', body: fd });
      if (!res.ok) throw new Error(`Upload failed (${res.status})`);
      return res.json(); // { id, originalName, type, ... }
    }

    async function resolveAttachMedia(tab) {
      const a = attachState[tab];
      if (!a) return null;
      if (a.id) return a.id;
      if (a.file) {
        const item = await uploadAttachFile(a.file);
        setAttach(tab, { id: item.id, name: item.originalName, type: item.type });
        if (!libItems.find(i => i.id === item.id)) libItems.unshift(item);
        return item.id;
      }
      return null;
    }

    async function patchSegmentMedia(segmentId, mediaId) {
      await fetch(`${API_BASE}/api/orchestrator/segments/${segmentId}/media`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mediaId: mediaId || null })
      });
    }

    async function detachSegmentMedia(segmentId) {
      await patchSegmentMedia(segmentId, null);
      refreshAll();
    }

    // ---- Picker modal ----
    async function fetchLibItems() {
      try {
        const res = await fetch(`${API_BASE}/api/media?limit=500`);
        const data = await res.json();
        libItems = (data.items || []).slice().reverse();
      } catch (e) { libItems = []; }
    }

    function openPicker(target) {
      pickerTarget = target;
      document.getElementById('picker-modal').classList.add('open');
      document.getElementById('picker-search').value = '';
      renderPickerGrid();
      if (libItems.length === 0) fetchLibItems().then(renderPickerGrid);
    }

    function closePicker() {
      document.getElementById('picker-modal').classList.remove('open');
      pickerTarget = null;
    }

    function renderPickerGrid() {
      const q = document.getElementById('picker-search').value.toLowerCase();
      const filtered = q ? libItems.filter(i => i.originalName.toLowerCase().includes(q)) : libItems;
      const grid = document.getElementById('picker-grid');
      if (filtered.length === 0) {
        grid.innerHTML = '<span class="empty-state">No media. Upload something first.</span>';
        return;
      }
      grid.innerHTML = filtered.slice(0, 60).map(item => `
        <div class="picker-item" onclick="selectPickerItem('${item.id}','${item.originalName.replace(/'/g,"\\'")}','${item.type}')">
          ${item.type === 'video'
            ? `<div class="picker-thumb-placeholder">🎬</div>`
            : `<img class="picker-thumb" src="${API_BASE}/api/media/${item.id}/thumbnail" alt="">`}
          <div class="picker-item-name" title="${item.originalName}">${item.originalName}</div>
        </div>
      `).join('');
    }

    async function selectPickerItem(id, name, type) {
      closePicker();
      if (pickerTarget === 'seed' || pickerTarget === 'script') {
        setAttach(pickerTarget, { id, name, type });
      } else if (pickerTarget?.startsWith('seg:')) {
        const segId = pickerTarget.replace('seg:', '');
        await patchSegmentMedia(segId, id);
        refreshAll();
      }
    }

    // Close picker on backdrop click
    document.getElementById('picker-modal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('picker-modal')) closePicker();
    });
    // ---- End media attach ----

    async function apiGet(path) {
      const res = await fetch(API_BASE + path);
      return res.json();
    }

    async function apiPost(path, data) {
      const res = await fetch(API_BASE + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      return res.json();
    }

    function renderRendering(segments) {
      const forming = segments.filter(s => s.status === 'forming');
      const container = document.getElementById('rendering-section');

      if (forming.length === 0) {
        container.innerHTML = '<span class="empty-state">No segments rendering</span>';
        return;
      }

      container.innerHTML = forming.map(seg => {
        const failed = seg.renderProgress === -1;
        const pct = failed ? 0 : Math.round((seg.renderProgress || 0) * 100);
        const errorMsg = seg.metadata?.renderError || 'Failed';
        const attachedId = seg.metadata?.attachedMediaId;
        return `
          <div class="rendering-card${failed ? ' failed' : ''}" data-id="${seg.id}">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div class="type">${seg.type}</div>
              <button class="btn-small btn-danger delete-rendering" style="padding:2px 6px;font-size:0.7rem;">X</button>
            </div>
            <div class="seed">${(seg.seed || 'filler').slice(0, 25)}${(seg.seed || '').length > 25 ? '...' : ''}</div>
            ${failed
              ? `<div style="font-size:0.75rem;color:#c44;margin-top:4px;">${errorMsg}</div>`
              : `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
                 <div style="font-size:0.75rem;color:var(--muted);margin-top:4px;">${pct}%</div>`
            }
            ${attachedId
              ? `<div style="font-size:0.72rem;color:var(--accent);margin-top:4px;">📺 cued</div>
                 <button class="btn-attach" onclick="openPicker('seg:${seg.id}')">↻ Change</button>
                 <button class="btn-attach" style="color:#f66;" onclick="detachSegmentMedia('${seg.id}')">✕ Detach</button>`
              : `<button class="btn-attach" onclick="openPicker('seg:${seg.id}')">📺 Attach TV</button>`
            }
          </div>
        `;
      }).join('');

      // Attach delete handlers
      container.querySelectorAll('.delete-rendering').forEach(btn => {
        btn.addEventListener('click', async () => {
          const card = btn.closest('.rendering-card');
          const id = card.dataset.id;
          await fetch(`${API_BASE}/api/pipeline/${id}`, { method: 'DELETE' });
          refreshAll();
        });
      });
    }

    function renderPipeline(segments, onAirId) {
      // Get only ready segments, oldest first (index 0 = oldest = rightmost in UI)
      const ready = segments.filter(s => s.status === 'ready');
      const container = document.getElementById('pipeline-section');

      if (ready.length === 0) {
        container.innerHTML = '<span class="empty-state">Pipeline empty</span>';
        return;
      }

      // Reverse for display: newest on left, oldest (on-air) on right
      const displayOrder = [...ready].reverse();

      container.innerHTML = displayOrder.map((seg, index) => {
        // The last one in display (rightmost) is the on-air one (index 0 in original array)
        const isOnAir = index === displayOrder.length - 1 && onAirId === seg.id;
        const attachedId = seg.metadata?.attachedMediaId;
        return `
          <div class="pipeline-card${isOnAir ? ' on-air' : ''}">
            ${isOnAir ? '<div class="on-air-badge">On Air</div>' : ''}
            <div class="type">${seg.type}</div>
            <div class="seed">${(seg.seed || 'filler').slice(0, 30)}${(seg.seed || '').length > 30 ? '...' : ''}</div>
            <div class="duration">${seg.estimatedDuration || 0}s</div>
            ${attachedId
              ? `<div style="font-size:0.72rem;color:var(--accent);margin-top:2px;">📺 cued</div>
                 ${!isOnAir ? `<button class="btn-attach" onclick="openPicker('seg:${seg.id}')">↻</button>
                 <button class="btn-attach" style="color:#f66;" onclick="detachSegmentMedia('${seg.id}')">✕</button>` : ''}`
              : (!isOnAir ? `<button class="btn-attach" onclick="openPicker('seg:${seg.id}')">📺 Attach</button>` : '')
            }
          </div>
        `;
      }).join('');
    }

    function renderArchive(segments) {
      const aired = segments.filter(s => s.status === 'aired');
      const container = document.getElementById('archive-section');

      if (aired.length === 0) {
        container.innerHTML = '<span class="empty-state">No archived segments</span>';
        return;
      }

      // Show most recent first
      container.innerHTML = aired.slice().reverse().map(seg => `
        <div class="archive-item">
          <strong>${seg.type}</strong>: ${(seg.seed || 'filler').slice(0, 50)}
        </div>
      `).join('');
    }

    function renderChatInbox(inbox) {
      const container = document.getElementById('chat-inbox');

      if (!inbox || inbox.length === 0) {
        container.innerHTML = '<span class="empty-state">No messages</span>';
        return;
      }

      container.innerHTML = inbox.map(card => {
        const responsePreview = card.response
          ? `<div class="response-preview">${card.response.speaker}: ${card.response.text.slice(0, 50)}...</div>`
          : '';
        return `
          <div class="chat-card" data-id="${card.id}">
            <div class="username">${card.username}</div>
            <div class="text">${card.text}</div>
            ${responsePreview}
            <div class="actions">
              <button class="btn-small btn-primary queue-btn">Queue</button>
              <button class="btn-small btn-danger dismiss-btn">Dismiss</button>
            </div>
          </div>
        `;
      }).join('');

      // Attach handlers
      container.querySelectorAll('.chat-card').forEach(el => {
        const cardId = el.dataset.id;
        const card = inbox.find(c => c.id === cardId);

        el.querySelector('.queue-btn').addEventListener('click', async (e) => {
          e.target.disabled = true;
          e.target.textContent = 'Queuing...';
          try {
            if (card.response) {
              await apiPost('/api/orchestrator/queue-response', {
                speaker: card.response.speaker,
                text: card.response.text,
                seed: card.text
              });
            } else {
              const result = await apiPost('/api/orchestrator/expand-chat', { message: card.text });
              if (!result.error) {
                await apiPost(`/api/orchestrator/render/${result.id}`, {});
              }
            }
            await fetch(`${API_BASE}/api/orchestrator/chat/inbox/${cardId}`, { method: 'DELETE' });
            refreshAll();
          } catch (err) {
            alert(err.message);
          }
        });

        el.querySelector('.dismiss-btn').addEventListener('click', async () => {
          await fetch(`${API_BASE}/api/orchestrator/chat/inbox/${cardId}`, { method: 'DELETE' });
          refreshAll();
        });
      });
    }

    function updateStatus(status, bufferHealth) {
      const statusEl = document.getElementById('playback-status');
      const bufferEl = document.getElementById('buffer-info');
      const dot = document.getElementById('status-dot');

      dot.className = 'status-dot';

      if (status.isPaused) {
        statusEl.textContent = 'Paused';
        dot.classList.add('paused');
      } else if (status.isPlaying) {
        if (status.currentSegmentId) {
          statusEl.textContent = 'Playing';
          dot.classList.add('playing');
        } else {
          statusEl.textContent = 'Waiting...';
        }
      } else {
        statusEl.textContent = 'Stopped';
        dot.classList.add('stopped');
      }

      currentSegmentId = status.currentSegmentId;
      bufferEl.textContent = `Buffer: ${bufferHealth?.totalSeconds || 0}s (${bufferHealth?.readyCount || 0})`;
    }

    async function refreshAll() {
      try {
        const [pipeline, status, inbox, chatConfig] = await Promise.all([
          apiGet('/api/pipeline'),
          apiGet('/api/orchestrator/status'),
          apiGet('/api/orchestrator/chat/inbox'),
          apiGet('/api/orchestrator/chat/config')
        ]);

        renderRendering(pipeline.segments || []);
        renderPipeline(pipeline.segments || [], status.currentSegmentId);
        renderArchive(pipeline.segments || []);
        renderChatInbox(inbox.inbox || []);
        updateStatus(status, pipeline.bufferHealth);

        document.getElementById('filler-toggle').checked = status.fillerEnabled || false;
        document.getElementById('auto-approve-toggle').checked = chatConfig.autoApprove || false;
      } catch (err) {
        console.error('Refresh failed:', err);
      }
    }

    function connectWebSocket() {
      const base = new URL(API_BASE);
      const wsProtocol = base.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${wsProtocol}//${base.host}/ws/orchestrator`);

      ws.onopen = () => {
        document.getElementById('playback-status').textContent = 'Connected';
        refreshAll();
      };

      ws.onmessage = (event) => {
        const payload = JSON.parse(event.data);
        if (payload.event === 'pipeline:update') {
          const data = payload.data;
          renderRendering(data.segments || []);
          renderPipeline(data.segments || [], data.currentSegmentId);
          renderArchive(data.segments || []);
          updateStatus(data.playbackStatus || {}, data.bufferHealth);
        }
        if (payload.event === 'chat:new-card') {
          refreshAll();
        }
      };

      ws.onclose = () => {
        document.getElementById('playback-status').textContent = 'Reconnecting...';
        setTimeout(connectWebSocket, 2000);
      };
    }

    // Event handlers
    document.getElementById('play-btn').addEventListener('click', async () => {
      await apiPost('/api/orchestrator/play', {});
      refreshAll();
    });

    document.getElementById('pause-btn').addEventListener('click', async () => {
      await apiPost('/api/orchestrator/pause', {});
      refreshAll();
    });

    document.getElementById('filler-toggle').addEventListener('change', async (e) => {
      await apiPost('/api/orchestrator/filler', { enabled: e.target.checked });
    });

    document.getElementById('auto-approve-toggle').addEventListener('change', async (e) => {
      await apiPost('/api/orchestrator/chat/auto-approve', { enabled: e.target.checked });
    });

    document.getElementById('create-btn').addEventListener('click', async () => {
      const seed = document.getElementById('seed-input').value.trim();
      if (!seed) return;

      const btn = document.getElementById('create-btn');
      btn.disabled = true;
      btn.textContent = 'Creating...';

      try {
        // Create segment + upload media in parallel
        const [result, mediaId] = await Promise.all([
          apiPost('/api/orchestrator/expand', { seed }),
          resolveAttachMedia('seed').catch(err => { console.warn('Media upload failed:', err); return null; })
        ]);

        if (result.error) {
          alert(result.error);
        } else {
          await apiPost(`/api/orchestrator/render/${result.id}`, {});
          if (mediaId) await patchSegmentMedia(result.id, mediaId);
          document.getElementById('seed-input').value = '';
          clearAttach('seed');
        }
      } catch (err) {
        alert(err.message);
      }

      btn.disabled = false;
      btn.textContent = 'Create';
      refreshAll();
    });

    document.getElementById('create-custom-btn').addEventListener('click', async () => {
      const raw = document.getElementById('custom-script-json').value.trim();
      if (!raw) return;

      const btn = document.getElementById('create-custom-btn');
      btn.disabled = true;
      btn.textContent = 'Creating...';

      try {
        const parsed = JSON.parse(raw);
        const payload = {
          seed: document.getElementById('custom-seed-input').value.trim() || parsed.seed || 'custom-script',
          type: parsed.type || 'custom-script',
          script: parsed.script,
          exitContext: parsed.exitContext || null,
          estimatedDuration: parsed.estimatedDuration,
          metadata: parsed.metadata || {}
        };

        // Create segment + upload media in parallel
        const [result, mediaId] = await Promise.all([
          apiPost('/api/orchestrator/custom-script', payload),
          resolveAttachMedia('script').catch(err => { console.warn('Media upload failed:', err); return null; })
        ]);

        if (result.error) {
          alert(result.error);
        } else {
          await apiPost(`/api/orchestrator/render/${result.id}`, {});
          if (mediaId) await patchSegmentMedia(result.id, mediaId);
          document.getElementById('custom-script-json').value = '';
          clearAttach('script');
        }
      } catch (err) {
        alert(`Invalid JSON or request failed: ${err.message}`);
      }

      btn.disabled = false;
      btn.textContent = 'Create Custom';
      refreshAll();
    });

    document.getElementById('hype-btn').addEventListener('click', async () => {
      const btn = document.getElementById('hype-btn');
      const statusEl = document.getElementById('hype-status');
      const mcap    = document.getElementById('hype-mcap').value.trim();
      const volume  = document.getElementById('hype-volume').value.trim();
      const holders = document.getElementById('hype-holders').value.trim();

      btn.disabled = true;
      btn.textContent = 'GENERATING...';
      statusEl.textContent = '';

      try {
        const body = {};
        if (mcap)    body.mcap    = mcap;
        if (volume)  body.volume  = volume;
        if (holders) body.holders = holders;

        const result = await apiPost('/api/orchestrator/hype', body);
        if (result.error) throw new Error(result.error);

        await apiPost(`/api/orchestrator/render/${result.id}`, {});
        statusEl.textContent = 'Queued!';
        setTimeout(() => { statusEl.textContent = ''; }, 3000);
        refreshAll();
      } catch (err) {
        statusEl.textContent = `Error: ${err.message}`;
      }

      btn.disabled = false;
      btn.textContent = 'HYPE';
    });

    document.getElementById('clear-archive').addEventListener('click', async () => {
      await fetch(`${API_BASE}/api/pipeline/clear-aired`, { method: 'DELETE' });
      refreshAll();
    });

    // Initialize
    connectWebSocket();
  </script>
</body>
</html>
