#!/usr/sbin/nft -f
# Inbound: SSH, HTTP, HTTPS only. Outbound (APIs, RTMP 1935) unrestricted.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;
        ct state established,related accept
        ct state invalid drop
        iif lo accept
        meta l4proto { icmp, ipv6-icmp } accept
        tcp dport { 22, 80, 443 } accept
        # Suite server (suite.virginvschad.vip) proxies chat/orchestrator/streams to 3002/3003
        ip saddr 93.127.214.75 tcp dport { 3002, 3003 } accept
    }
    chain forward {
        type filter hook forward priority 0; policy drop;
    }
    chain output {
        type filter hook output priority 0; policy accept;
    }
}
